name: playground
description: >
  Sandbox interno para validar o pipeline completo (LabelDesigner +
  label_serialization + label_layout_engine + label_renderer_pdf +
  label_renderer_argox) manualmente durante o desenvolvimento, consumindo
  tudo via flutter_label_designer — a mesma única dependência que um projeto
  externo usaria (ver docs/INTEGRATION.md). Não é um entregável — o
  projeto do usuário nunca importa este pacote. Ver docs/ARCHITECTURE.md,
  seção 4, e docs/ROADMAP.md, etapa 17.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.8.1
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_label_designer:
    path: ../../packages/flutter_label_designer
  file_picker: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0

flutter:
  uses-material-design: true
