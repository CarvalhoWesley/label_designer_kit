name: label_widgets
description: >
  UI kit reutilizável do editor: botões, seletor de cor, réguas e ícones
  semânticos. Componentes puramente visuais — não conhece LabelDocument
  nem nenhum store de label_designer_state. Ver docs/ARCHITECTURE.md,
  seção 7.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.8.1
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0
