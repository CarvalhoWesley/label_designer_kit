name: label_property_panel
description: >
  Painel de propriedades: edição reativa dos campos do(s) elemento(s)
  selecionado(s), ligada a PropertyStore/DocumentStore/SelectionStore. Não
  calcula layout. Ver docs/ARCHITECTURE.md, seção 7.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.8.1
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  label_core:
    path: ../label_core
  label_designer_state:
    path: ../label_designer_state
  label_widgets:
    path: ../label_widgets
  flutter_mobx: ^2.3.0
  mobx: ^2.5.0
  file_picker: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0
