name: label_designer_state
description: >
  Stores MobX que orquestram documento, seleção, histórico, camadas e
  viewport do editor. Pacote Dart puro, sem dependência de Flutter — apenas
  reativo via mobx. Ver docs/ARCHITECTURE.md, seção 14.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.1

dependencies:
  label_core:
    path: ../label_core
  label_history:
    path: ../label_history
  label_serialization:
    path: ../label_serialization
  mobx: ^2.5.0

dev_dependencies:
  build_runner: ^2.4.15
  lints: ^5.0.0
  mobx_codegen: ^2.7.0
  test: ^1.24.0
