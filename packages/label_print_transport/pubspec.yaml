name: label_print_transport
description: >
  Contrato PrintTransport/PrinterDiscovery para enviar bytes já renderizados
  (PPLA, PDF, ...) a uma impressora física, sem conhecer LabelDocument nem
  nenhum renderer. Pacote Dart puro — nenhuma implementação concreta aqui,
  só a interface. Ver docs/ARCHITECTURE.md e docs/ROADMAP.md, etapa 20.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.1

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
