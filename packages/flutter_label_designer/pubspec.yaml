name: flutter_label_designer
description: >
  Pacote guarda-chuva: reexporta toda a API pública que um projeto
  consumidor precisa (editor, motor de layout, serialização e renderers)
  atrás de uma única dependência. Ver docs/ARCHITECTURE.md, seção 20, e
  docs/INTEGRATION.md.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.1
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  label_core:
    path: ../label_core
  label_designer:
    path: ../label_designer
  label_layout_engine:
    path: ../label_layout_engine
  label_renderer:
    path: ../label_renderer
  label_renderer_argox:
    path: ../label_renderer_argox
  label_renderer_argox_raster:
    path: ../label_renderer_argox_raster
  label_renderer_canvas:
    path: ../label_renderer_canvas
  label_renderer_pdf:
    path: ../label_renderer_pdf
  label_serialization:
    path: ../label_serialization

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0
