name: label_barcode
description: >
  Geração de símbolos de código de barras/QR (padrão de módulos, sem
  desenhar nada) para os renderers do Label Designer Framework. Adapta
  package:barcode por trás de uma interface própria (Adapter pattern),
  trocável sem afetar consumidores.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.1

dependencies:
  barcode: ^2.2.9
  equatable: ^2.0.5
  label_core:
    path: ../label_core

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
