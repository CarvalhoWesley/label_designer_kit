name: label_history
description: >
  Command Pattern e undo/redo sobre LabelDocument. Cada Command produz uma
  nova versão imutável do documento via copyWith; nunca muta o documento
  em lugar. Pacote Dart puro, sem dependência de Flutter ou MobX.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.1

dependencies:
  label_core:
    path: ../label_core

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
