name: label_print_transport_windows
description: >
  Backend de label_print_transport para o spooler de impressão do Windows,
  embrulhando o pacote de terceiros windows_printer (impressão raw via USB
  e impressão de PDF pelo driver instalado). Windows-only por natureza —
  ver docs/ROADMAP.md, etapa 20, para os backends irmãos planejados
  (rede/TCP, serial) que não dependem deste pacote.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.8.1
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  label_print_transport:
    path: ../label_print_transport
  windows_printer: ^0.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0
